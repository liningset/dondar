<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b2b2b" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Source+Code+Pro&family=Dancing+Script:wght@700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <title>Dondar - The Swiss army knife for textual conversions</title>

    <style>
      noscript {
        background: #0c152f;
        color: #f3f3f3;
        position: fixed;
        inset: 0;
        margin: auto;
        display: grid;
        place-items: center;
        font-family: "Source Code Pro";
      }
      noscript > div {
        width: min(25rem, 90%);
        text-align: start;
      }
      noscript span {
        font-size: 2rem;
      }
    </style>
  </head>
  <body data-theme="light">
    <noscript
      ><div>
        <span>:(</span>
        <h2>Oops, Your JavaScript is disabled</h2>
        <p>
          This site makes heavy use of React.js which is a JavaScript library.
          Please enable your JavaScript then refresh this page.
        </p>
      </div></noscript
    >
    <div id="root"></div>

    <script>
      document.body.dataset.theme = sessionStorage.getItem("theme") || "light";
      window.addEventListener("scroll", () => {
        if (scrollMaxY === scrollY)
          document.querySelector("#scroll-btn").dataset.scrollto = "down";
        if (scrollY === 0)
          document.querySelector("#scroll-btn").dataset.scrollto = "up";
      });
    </script>
  </body>
</html>
