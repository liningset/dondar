  <body data-theme="light">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="nav-container">
      <nav class="navbar">
        <ul class="navlist-left">
          <li title="switch theme">
            <button class="theme-toggle-btn" data-theme="light">
              <i class="fas fa-sun"></i>
            </button>
          </li>
        </ul>
        <ul class="navlist-right">
          <li>

    <script>
      let btn = document.querySelector(".theme-toggle-btn");
      let navContainer = document.querySelector(".nav-container");
      document.body.dataset.theme = sessionStorage.getItem("theme")
        ? sessionStorage.getItem("theme")
        : "light";

      btn.querySelector("i").className =
        document.body.dataset.theme === "dark" ? "fas fa-moon" : "fas fa-sun";

      btn.addEventListener("click", toggleTheme);
      function toggleTheme() {
        if (document.body.dataset.theme === "light") {
          sessionStorage.setItem("theme", "dark");
          btn.querySelector("i").className = "fas fa-moon";
        } else {
          sessionStorage.setItem("theme", "light");
          btn.querySelector("i").className = "fas fa-sun";
        }
        document.body.dataset.theme = sessionStorage.getItem("theme");
      }
      /*const observer = new IntersectionObserver(
        (entries) => {

            if (entry.isIntersecting) {
              navContainer.style.position = "fixed";
            } else {
              navContainer.style.position = "relative";
            }
          });
        },
        { threshold: 1 }
      );
      observer.observe(navContainer);*/
    </script>
  </body>
